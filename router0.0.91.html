      /* === RoutingMode: "manhattan" | "45deg" === */
      function solveCorner(a, b, mode) {
        if (mode === "manhattan") {
          // 90° routing (L-shape)
          return new THREE.Vector3(b.x, a.y, a.z);
        }
        if (mode === "45deg") {
          const dx = b.x - a.x;
          const dz = b.z - a.z;
          const dist = Math.min(Math.abs(dx), Math.abs(dz));
          return new THREE.Vector3(
            a.x + Math.sign(dx) * dist,
            a.y,
            a.z + Math.sign(dz) * dist
          );
        }
        return b;
      }//end solveCorner
      let lockedAxis = null;
      function applyAxisLock(start, current) {
        if (!lockedAxis) {
          const dx = Math.abs(current.x - start.x);
          const dz = Math.abs(current.z - start.z);
          lockedAxis = dx > dz ? "x" : "z";
        }
        if (lockedAxis === "x") {
          current.z = start.z;
        } else {
          current.x = start.x;
        }
        return current;
      }//end applyAxisLock

        handleFinish() {
          if (!this.isRouting) return null;
          const result = [...this.points];
          this.clear();
          this.isRouting = false;
          return result;

        start(p) {
          this.points = [p.clone()];

          this.points.push(p.clone());
        }
        updateCursor(cursor) {
          if (this.points.length === 0) return;
          const last = this.points[this.points.length - 1];
          const corner = solveCorner(last, cursor, this.mode);
          const previewPoints = [
            ...this.points,
            corner,
            cursor.clone()
          ];
          this.draw(previewPoints);
        }
        finish() {
          const result = [...this.points];
          this.clear();
          return result;
        }
        clear() {
          this.group.clear();
          this.points = [];
        }
        draw(points) {
          this.group.clear();
          for (let i = 0; i < points.length - 1; i++) {
            const a = points[i];
            const b = points[i + 1];
            const segment = this.createSegment(a, b);
            this.group.add(segment);
          }
        }
        createSegment(a, b) {
          const length = a.distanceTo(b);
          const geo = new THREE.BoxGeometry(this.width, 0.05, length);
          const mesh = new THREE.Mesh(geo, this.material);
          const mid = new THREE.Vector3()
            .addVectors(a, b)
            .multiplyScalar(0.5);
          mesh.position.copy(mid);
          mesh.lookAt(b);
          mesh.rotateX(Math.PI / 2);
          return mesh;
        }

          this.mesh = new THREE.Mesh(geometry, this.material);

class TraceRenderer {
  constructor(layerGroups) {
    this.layerGroups = layerGroups;
    this.material =
        new THREE.MeshStandardMaterial({
            color: 0xc87533,
            metalness: 0.75,
            roughness: 0.25
        });
  }
  renderPoints(points,width,group) {
    if (points.length < 2)
        return;
    for (let i = 0;i < points.length - 1;i++) {
        const a = points[i];
        const b = points[i + 1];
        group.add(
            this.createSegment(a,b,width)
        );
    }
    for (let i = 0;i < points.length;i++) {
        group.add(
            this.createJunction(
                points[i],width));
    }
  }
  render(trace) {
    const group = this.layerGroups[trace.layer];
    if (!group)
        return;
    // for (let i = 0;i < trace.points.length - 1;i++) {
    //     const a = trace.points[i];
    //     const b = trace.points[i + 1];
    //     const segment = this.createSegment(a,b,trace.width);
    //     group.add(segment);
    // }
    this.renderPoints(
      trace.points,
      trace.width,
      group
    );
    /* Rounded endpoint geometry */
    const startCap = this.createEndCap(trace.points[0],trace.width);
    const endCap = this.createEndCap(trace.points[trace.points.length - 1],trace.width);
    group.add(startCap);
    group.add(endCap);
    for (let i = 0;i < trace.points.length;i++) {
      const point = trace.points[i];
      const junction = this.createJunction(point,trace.width);
      group.add(junction);
    }
  }
  createSegment(a, b, width) {
    const dx = b.x - a.x;
    const dz = b.z - a.z;
    const length = Math.sqrt(dx * dx +dz * dz);
    if (length < 0.001)
        return new THREE.Object3D();
    /* Shape is created in XY space.
     *
     * Later we rotate the result so
     * it lies on the PCB XZ plane. */
    const shape = new THREE.Shape();
    const half = width / 2;
    shape.moveTo(0,-half);
    shape.lineTo(length,-half);
    shape.lineTo(length,half);
    shape.lineTo(0,half);
    shape.closePath();
    const geometry =
        new THREE.ExtrudeGeometry(
            shape,
            {
                depth: PCB_CONFIG.traceHeight,
                bevelEnabled: false,
                steps: 1
            }
        );
    geometry.rotateX(-Math.PI / 2);
    const mesh = new THREE.Mesh(geometry,this.material);
    /* Center the segment*/
    mesh.position.set(a.x,0,a.z);
    /* Rotate around Y so
     * local X points toward B.*/
    mesh.rotation.y = -Math.atan2(dz,dx);
    return mesh;
  }
  createEndCap(point, width) {
    const geometry = new THREE.CylinderGeometry(width / 2,width / 2,PCB_CONFIG.traceHeight,24);
    const mesh = new THREE.Mesh(geometry,this.material);
    mesh.rotation.x = Math.PI / 2;
    mesh.position.set(point.x,PCB_CONFIG.traceHeight / 2,point.z);
    return mesh;
  }
  createJunction(point, width) {
    const geometry = new THREE.CylinderGeometry(width / 2,width / 2,PCB_CONFIG.traceHeight,24);
    const mesh = new THREE.Mesh(geometry,this.material);
    mesh.position.set(point.x,PCB_CONFIG.traceHeight / 2,point.z);
    return mesh;
  }
}

class RoutingEngine {
    constructor(scene,layerGroup,traceRenderer) {
          this.scene = scene;
          // routing state
          this.layerGroup = layerGroup;
          this.traceRenderer = traceRenderer;
          this.points = [];
          this.isRouting = false;
          this.mode = "manhattan";
          this.width = PCB_CONFIG.traceWidth;
          this.lockedAxis = null;
          // preview group
          this.group = new THREE.Group();
          this.scene.add(this.group);
          //preview material
          this.material = new THREE.MeshStandardMaterial({
            color: 0xffaa00,
            emissive: 0xff6600,
            emissiveIntensity: 0.3,
            metalness: 0.7,
            roughness: 0.3
          });
          // this.width = 0.6;
        }
        // === PUBLIC API ===
        handleClick(point) {
          if (!this.isRouting) {
            this.start(point);
            this.isRouting = true;
          } else {
            this.addPoint(point);
          }
        }
        handleMove(point) {
          if (!this.isRouting) return;
          this.updateCursor(point);
        }
        handleFinish() {
          if (!this.isRouting) return null;
          const result = [...this.points];
          this.clear();
          this.isRouting = false;
          return result;
        }
        // === CORE ===
        start(point) {
          this.points = [point.clone()];
          this.isRouting = true;
          // this.lockedAxis = null;
          this.redraw([]);
        }
        //add point or corner
        addPoint(point) {
          if (!this.isRouting)
            return;
          this.points.push(point.clone());
        }
        updateCursor(cursor) {
          if (!this.isRouting)
            return;
          const last = this.points[this.points.length - 1];
          const route = this.solveRoute(last, cursor);
          // const preview = [
          //   ...this.points,
          //   corner,
          //   cursor.clone()
          // ];
          this.redraw(route);
        }
        clear() {
          this.group.clear();
          this.points = [];
          this.lockedAxis = null;
        }
        // Solve Route (LOGIC)
        solveRoute(a, b) {
          if (this.mode === "manhattan") {
            // return new THREE.Vector3(b.x, a.y, a.z);
            const corner = new THREE.Vector3(
              b.x,
              0,
              a.z
            );
            return [
              ...this.points,
              corner,
              b.clone()
            ];
          }
          if (this.mode === "45deg") {
            const dx = b.x - a.x;
            const dz = b.z - a.z;
            const dist = Math.min(Math.abs(dx), Math.abs(dz));
            const corner = new THREE.Vector3(
              a.x+Math.sign(dx)*distance,
              0,
              a.z+Math.sign(dz)*distance
            );
            return [
                ...this.points,
                corner,
                b.clone()
            ];
          }
          return [
            ...this.points,
            b.clone()
          ];
        }
        //RENDER
        redraw(points) {
          this.group.clear();
          if (points.length < 2) return;
            this.traceRenderer.renderPoints(
                points,
                this.width,
                this.group
            );
        }
        createSegment(a, b) {
          const length = a.distanceTo(b);
          if (length < 0.001)
            return new THREE.Object3D();
          const geo = new THREE.BoxGeometry(this.width, PCB_CONFIG.traceHeight, length);
          const mesh = new THREE.Mesh(geo, this.material);
          const mid = new THREE.Vector3()
            .addVectors(a, b)
            .multiplyScalar(0.5);
          mesh.position.copy(mid);
          mesh.lookAt(b);
          mesh.rotateX(Math.PI / 2);
          return mesh;
        }
        finish() {
          if (!this.isRouting)
            return null;
          const points =
            [...this.points];
          this.cancel();
          return points;
        }
        cancel() {
          this.group.clear();
          this.points = [];
          this.isRouting = false;
        }
      }
      /* === DATA STRUCTURES === */
      class SelectionManager {
        constructor(camera, scene) {
          this.raycaster = new THREE.Raycaster();
          this.mouse = new THREE.Vector2();
          this.camera = camera;
          this.scene = scene;
          this.selected = null;
        }
        pick(e) {
          this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
          this.raycaster.setFromCamera(this.mouse, this.camera);
          const hits = this.raycaster.intersectObjects(this.scene.children, true);
          if (!hits.length) return null;
          const obj = hits[0].object;
          if (obj.userData && obj.userData.pad) {
            return obj.userData.pad;
          }
          if (obj.parent && obj.parent.userData && obj.parent.userData.component) {
            return obj.parent.userData.component;
          }
          return null;
        }
      }
      class DragManager {
        constructor(camera) {
          this.dragging = null;
          this.plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
          this.raycaster = new THREE.Raycaster();
          this.mouse = new THREE.Vector2();
          this.camera = camera;
        }
        start(obj) {
          if (obj && obj.group) {
            this.dragging = obj;
          }
        }
        update(e) {
          if (!this.dragging) return;
          this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
          this.raycaster.setFromCamera(this.mouse, this.camera);
          const p = new THREE.Vector3();
          this.raycaster.ray.intersectPlane(this.plane, p);
          // snap
          p.x = Math.round(p.x / 1) * 1;
          p.z = Math.round(p.z / 1) * 1;
          this.dragging.group.position.copy(p);
        }
        stop() {
          this.dragging = null;
        }
      }//end DragManager2
      class Net {
        constructor(id, color) {
          this.id = id
          this.color = color
          this.pads = new Set();
        }
      }//end NET
      export class NetManager {
        nets = new Map()
        createNet(name) {
          const net = new Net(name, Math.random() * 0xffffff)
          this.nets.set(name, net)
          return net
        }
        get(name) {
          return this.nets.get(name)
        }
      }
      class PadShape {
        constructor(position, size) {
          this.position = position;
          this.size = size;
        }
      }//end PadShape
      class Footprint {
        constructor(name, pads) {
          this.name = name;
          this.pads = pads.filter(isPadShape);
        }
      }//end Footprint
      class Pad {
        constructor(id, pos, size) {
          const geo = new THREE.CircleGeometry(size, 16);
          const mat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });

          this.mesh = new THREE.Mesh(geo, mat);
          this.mesh.rotation.x = -Math.PI / 2;
          this.mesh.position.copy(pos);
          this.mesh.userData.pad = this;

          this.id = id;
          this.net = null;
        }
        connect(net) {
          this.net = net;
          net.pads.add(this);
          this.mesh.material.color.set(net.color);
        }
      }//end Pad
      class Component {
        constructor(fp, pos) {
          this.group = new THREE.Group();
          this.pads = [];

          let i = 0;
          for (const p of fp.pads) {
            const pad = new Pad("pad_" + i++, p.position.clone(), p.size);
            this.pads.push(pad);
            this.group.add(pad.mesh);
          }

          this.group.position.copy(pos);
          this.group.userData.component = this;
        }
      }//end Component
      class PCBState {
        constructor() {
          this.traces = []; // persistent traces
          this.vias = [];
          this.layers = [
            {name: "top",y: PCB_CONFIG.copper.top},
            {name: "bottom",y: PCB_CONFIG.copper.bottom}
          ];
        }
        addTrace(trace) {
          this.traces.push(trace);
        }
      }//end PCBState
      class Trace {
        constructor(points, layer = "top", width = 0.6) {
          this.points = points.map(p => p.clone());
          this.layer = layer;
          this.width = width;
        }
      }//end Trace
      class Via {
        constructor(position, fromLayer, toLayer) {
          this.position = position.clone();
          this.fromLayer = fromLayer;
          this.toLayer = toLayer;
        }
      }
      /* === TEST PCBBOARD CLASS === */
      const pcb = new PCBBoard(85, 56, 1.6)
      scene.add(pcb.mesh)
      
      /* === TEST DATA === */
      const footprint = new Footprint("test", [
        new PadShape(new THREE.Vector3(-5, 0, 0), 2),
        new PadShape(new THREE.Vector3(5, 0, 0), 2)
      ]);

      const component1 = new Component(footprint, new THREE.Vector3(0, 0, 0));
      component1.ref = "R1"
      const component2 = new Component(footprint, new THREE.Vector3(10,0,0))
      component2.ref = "R2"
      scene.add(component1.group);
      scene.add(component2.group)
      const components = [component1, component2]

      // systems
      const selector = new SelectionManager(camera, scene)
      const dragger = new DragManager(camera)
      const netManager = new NetManager()
      const router = new RoutingEngine(scene);
      const pcbState = new PCBState();

      // after scene + pcb created
      const layerGroups = {};
      pcbState.layers.forEach(layer => {
        const g = new THREE.Group();
        g.position.y = layer.y; // vertical stack
        scene.add(g);
        layerGroups[layer.name] = g;
      });
      // sample netlist
      importSimpleNetlist({
        nets:[
          {name:"NET1", pads:[{comp:"R1", pad:0},{comp:"R2", pad:1}]}
        ]
      }, components, netManager)

      window.addEventListener("mousedown", e => {
        // Only left mouse button
        if (e.button !== 0)
            return;
        const point = snapToGrid(getMousePoint(e,camera));
        if (!router.isRouting) {
            router.start(point);
        } else {
            router.addPoint(point);
        }
      });
      window.addEventListener("mousemove",e => {
        if (!router.isRouting)
          return;
        const point =
          snapToGrid(
            getMousePoint(
              e,
              camera
            )
          );
        router.updateCursor(point);
      });
      window.addEventListener("dblclick",e => {
        if (!router.isRouting)
            return;
        const points =
            router.finish();
        if (!points)
            return;
        if (points.length < 2)
            return;
        const trace = new Trace(
            points,
            "top",
            PCB_CONFIG.traceWidth
        );
        pcbState.addTrace(trace);
        renderTrace(trace);
    }
    window.addEventListener("keydown",e => {
        if (e.key === "Escape") {
            router.cancel();
        }
    });
